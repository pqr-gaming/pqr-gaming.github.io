db-cell-text{position:relative}div.dt-container .dt-info{padding:12px 16px!important;color:var(--muted)!important;font-size:11px;border-top:1px solid var(--line)}div.dt-container .dt-paging{padding:8px!important}div.dt-container .dt-paging .dt-paging-button{color:var(--pink)!important}div.dt-container .dt-paging .dt-paging-button.disabled{color:var(--muted)!important}.archive-note{margin:16px 0 0;font-size:11px;color:var(--muted)}.archive-note span{color:var(--pink);margin-right:10px}.footer{border-top:1px solid var(--line);padding:22px 0 30px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:10px;letter-spacing:1px}.footer p{margin:0}.footer a{color:#b092a3}.still .lain-motion{display:none}.still .lain-still{display:block}.still .hero-art::after{display:none}.error{color:var(--pink)}noscript{display:block;border:1px solid var(--pink);padding:16px;margin:16px 0}

<script>
(function() {
    const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
    function setStill(still) {
        document.body.classList.toggle('still', still);
    }
    setStill(preference.matches);
    preference.addEventListener('change', function(event) { setStill(event.matches); });
    if (!window.jQuery || !window.Papa || !window.jQuery.fn.DataTable) {
        document.getElementById('connection-status').textContent = 'CONNECTION LOST';
        const status = document.getElementById('summary');
        status.textContent = '页面组件加载失败，请检查网络后刷新，或直接读取 ';
        const link = document.createElement('a');
        link.href = 'PGDB.csv'; link.textContent = 'CSV 档案'; status.append(link);
    }
})();
</script>
    <script>
        if (window.jQuery && window.Papa && window.jQuery.fn.DataTable) {
        $(document).ready(function() {
            function slugifyName(name) {
                if (!name) return '';
                var result = String(name)

                    .replace(/[^\p{L}\p{N}\s]/gu, '')

                    .trim()
                    .replace(/\s+/g, '-')
                    .toLowerCase()
                ;

                return result;
            }

            const iconCache = new Map(); // key: url, val: dataUrl 或 true(已失败)
            const io = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const img = entry.target;
                    io.unobserve(img);
                    const url = img.dataset.src;
                    if (!url || img.dataset.loaded === '1') return;

                    if (iconCache.has(url)) {
                        const cached = iconCache.get(url);
                        if (cached && cached !== true) {

                            img.style.setProperty('--bg-url', `url('${cached}')`);
                            img.dataset.loaded = '1';
                        }
                        return;
                    }

                    fetch(url)
                        .then(r => {
                            if (!r.ok) throw new Error('not ok');

                            return r.blob().then(blob => ({ kind: 'blob', data: blob }));
                        })
                        .then(res => {
                            let src;

                            src = URL.createObjectURL(res.data);
                            iconCache.set(url, src);

                            img.style.setProperty('--bg-url', `url('${src}')`);
                            img.dataset.loaded = '1';
                        })
                        .catch(() => {

                            iconCache.set(url, true);
                        })
                    ;
                });
            }, { root: null, rootMargin: '200px 0px', threshold: 0 });

            function scheduleLazyLoad() {

                const fn = () => {
                    $('#csv-table img.pgdb-icon').each(function() {
                        const img = this;
                        if (img.src) return; // 已经加载过
                        io.observe(img);
                    });
                    $('#csv-table tbody td.pgdb-col1-bg[data-src]').each(function() {
                        if (this.dataset.loaded === '1') return;
                        io.observe(this);
                    });
                };
                if (window.requestIdleCallback) {
                    requestIdleCallback(fn, { timeout: 1000 });
                } else {
                    setTimeout(fn, 0);
                }
            }

            Papa.parse('PGDB.csv', {
                download: true,
                header: true,
                skipEmptyLines: 'greedy',
                error: function() {
                    $('#connection-status').text('CONNECTION LOST');
                    $('#summary').addClass('error').text('档案加载失败，请检查网络后刷新页面。');
                },
                complete: function(results) {
                    const filteredData = results.data.filter(row =>
                        Object.values(row).some(cell => cell !== "")
                    );

                    if (!filteredData.length) {
                        $('#summary').text('档案暂无条目。');
                        $('#connection-status').text('EMPTY ARCHIVE');
                        return;
                    }
                    const uniqueValues = {};
                    filteredData.forEach(row => {
                        Object.keys(row).forEach((col, index) => {
                            if (!uniqueValues[col]) uniqueValues[col] = new Set();
                            uniqueValues[col].add(row[col]);
                        });
                    });

                    const totalEntries = filteredData.length;
                    const avgRecommendationIndex = filteredData.reduce((sum, row) => {
                        const value = parseFloat(row['推荐指数']);
                        return sum + (isNaN(value) ? 0 : value);
                    }, 0) / totalEntries;

                    $('#summary').empty().closest('.readout').hide();

                    $('#entry-count').text(totalEntries);
                    $('#average-score').text(avgRecommendationIndex.toFixed(2));
                    renderScoreHistogram(filteredData);
                    $('#connection-status').text('CONNECTED / ARCHIVE ONLINE');
                    displayTable(filteredData, uniqueValues);
                }
            });

            function renderScoreHistogram(data) {
                const counts = Array(11).fill(0);
                data.forEach(row => {
                    const score = Number(row['推荐指数']);
                    if (Number.isInteger(score) && score >= 1 && score <= 10) counts[score]++;
                });
                const maximum = Math.max(1, ...counts);
                const plot = document.getElementById('hist-plot');
                plot.replaceChildren();
                for (let score = 10; score >= 1; score--) {
                    const bin = document.createElement('div');
                    bin.className = 'hist-bin';
                    bin.tabIndex = 0;
                    bin.setAttribute('role', 'img');
                    bin.setAttribute('aria-label', `${score}分：${counts[score]}项`);
                    const track = document.createElement('span');
                    track.className = 'hist-track';
                    const bar = document.createElement('span');
                    bar.className = 'hist-bar';
                    bar.dataset.tip = `${score}分 · ${counts[score]}项`;
                    bar.style.setProperty('--bar-height', `${counts[score] / maximum * 100}%`);
                    const ratio = (score - 1) / 9;
                    const color = [139, 48, 68].map((channel, i) =>
                        Math.round(channel + ([255, 143, 188][i] - channel) * ratio));
                    bar.style.setProperty('--bar-color', `rgb(${color.join(', ')})`);
                    const label = document.createElement('span');
                    label.className = 'hist-label';
                    label.textContent = score;
                    track.append(bar);
                    bin.append(track, label);
                    plot.append(bin);
                }
                document.getElementById('score-histogram').hidden = false;
            }

            function displayTable(data, uniqueValues) {

                const columns = Object.keys(data[0]).map(header => ({
                    title: header,
                    data: header,
                    render: $.fn.dataTable.render.text()
                }));

                const table = $('#csv-table').DataTable({
                    layout: { topStart: null, topEnd: null, bottomStart: 'info', bottomEnd: null },
                    language: { info: '显示 _START_–_END_ / 共 _TOTAL_ 项', infoEmpty: '显示 0 项', infoFiltered: '（从 _MAX_ 项档案中筛选）', zeroRecords: '没有匹配的游戏，请修改关键词或重置筛选。', emptyTable: '暂无游戏档案', aria: { orderable: '点击排序', orderableReverse: '反向排序', orderableRemove: '取消排序' } },
                    data: data,
                    columns: columns,
                    order: [
                        [4, 'desc'],
                        [0, 'asc']
                    ],
                    pageLength: -1,

                    lengthChange: false,

                    initComplete: function() {
                        $('#csv-table thead').append('<tr class="filter-row" data-dt-order="disable"></tr>');
                        this.api().columns().every(function() {
                            const column = this;
                            const columnTitle = $(column.header()).text();
                            const newColumn = $('<th></th>').appendTo($('#csv-table thead .filter-row'))
                            if (['年份', '平台', '推荐指数', '添加时间'].includes(columnTitle)) {

                                const select = $('<select><option value="">全部</option></select>').attr('aria-label', '筛选' + columnTitle)
                                    .appendTo(newColumn)
                                    .on('change', function() {
                                        const val = $.fn.dataTable.util.escapeRegex($(this).val());
                                        if (columnTitle === '添加时间' && val) {
                                            if (val != "≤2020")
                                                column.search('^' + val, true, false).draw();
                                            else
                                                column.search('^≤2020', true, false).draw();
                                        }
                                        else {
                                            column.search(val ? `^${val}$` : '', true, false).draw();
                                        }
                                    });

                                let counts = {};
                                column.data().each(function(value) {
                                    counts[value] = (counts[value] || 0) + 1;
                                });
                                if (columnTitle == '添加时间') {
                                    counts = {};
                                    column.data().each(function(value) {

                                        if (value == '≤2020')
                                            counts[value] = (counts[value] || 0) + 1;
                                        else {
                                            const year = value.split('/')[0];
                                            counts[year] = (counts[year] || 0) + 1;
                                        }
                                    });
                                    select.append(`<option value="≤2020">≤2020 (${counts['≤2020']})</option>`);
                                    Object.keys(counts).sort().forEach(function(value) {
                                        if (value && value != '≤2020') {
                                            select.append(`<option value="${value}">${value} (${counts[value]})</option>`);
                                        }
                                    });
                                }
                                else if (columnTitle != '推荐指数') {
                                    Object.keys(counts).sort().forEach(function(value) {
                                        if (value) {
                                            select.append(`<option value="${value}">${value} (${counts[value]})</option>`);
                                        }
                                    });
                                }
                                else {

                                    Object.keys(counts).sort((a, b) => {
                                        return parseFloat(a) - parseFloat(b); // 使用数值排序而不是字典序
                                    }).forEach(function(value) {
                                        if (value) {
                                            select.append(`<option value="${value}">${value} (${counts[value]})</option>`);
                                        }
                                    });
                                }
                            }
                        });

                        scheduleLazyLoad();
                    },

                    createdRow: function(row, data, dataIndex) {
                        const value = parseFloat(data['推荐指数']); // 第五列数据

                        if (!isNaN(value)) {

                            // Continuous interpolation: 1 = dark red, 10 = bright pink.
                            const ratio = (Math.min(10, Math.max(1, value)) - 1) / 9;
                            const low = [139, 48, 68];
                            const high = [255, 143, 188];
                            const color = low.map((channel, i) =>
                                Math.round(channel + (high[i] - channel) * ratio));
                            $(row).find('td:eq(4)').css({
                                '--score-background': `rgb(${color.join(', ')})`,
                                '--score-text': value >= 5 ? '#0b090c' : '#ffffff'
                            });
                            if (value >= 7) {
                                const strength = Math.min(4, value - 6);
                                const glow = `0 0 ${6 + strength * 4}px rgba(255, 143, 188, ${0.4 + strength * 0.13}), ` +
                                    `0 0 ${10 + strength * 9}px ${strength + 1}px rgba(255, 100, 165, ${0.15 + strength * 0.12})`;
                                $(row).find('td:eq(4)').addClass('score-glow').css('--score-glow', glow);
                            }
                        }

                        const $nameCell = $('td:eq(0)', row);
                        const cell = $nameCell[0];
                        const nameText = data['名称'] || $nameCell.text().trim();

                        const iconUrl = `covers/${slugifyName(nameText)}.jpg`;

                        $nameCell.empty().append($('<span class="pgdb-cell-text">').text(nameText));

                        cell.classList.add('pgdb-col1-bg');
                        cell.dataset.src = iconUrl;
                    },
                });

                $('#csv-table').on('draw.dt', function() {
                    scheduleLazyLoad();
                });
                $('#archive-search').on('input', function() { table.search(this.value).draw(); });
                // Apply a query typed while the CSV was still loading.
                table.search($('#archive-search').val()).draw();
            }
        });
        }
    </script>
</body>
</html>
